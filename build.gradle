plugins {
    id "java"
}

group = "com.github.monaboiste"
version = "0.1.0"
description = "Fair Share - A group expense tracking and netting app " +
        "that minimizes the number of payments needed to settle up."

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:6.0.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}