spring.application.name=fair-share

spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.read.strict-duplicate-detection=true
spring.jackson.mapper.allow-coercion-of-scalars=false

fair-share.persistence.sqlite.jdbc-url=jdbc:sqlite:fair-share.db
fair-share.persistence.sqlite.busy-timeout-millis=5000
fair-share.persistence.sqlite.synchronous=EXTRA

logging.structured.format.console=logstash
management.tracing.sampling.probability=0.1
