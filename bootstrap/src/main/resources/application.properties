spring.application.name=fair-share

fair-share.persistence.sqlite.jdbc-url=jdbc:sqlite:fair-share.db
fair-share.persistence.sqlite.busy-timeout-millis=5000
fair-share.persistence.sqlite.synchronous=EXTRA
fair-share.rest.problem-origin=http://localhost:8080

logging.structured.format.console=logstash
management.tracing.sampling.probability=0.1
