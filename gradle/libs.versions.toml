[versions]

# Core
java = "25"

# Development
jspecify = "1.0.1"

# Logging
slf4j = "2.0.18"
logback = "1.6.3"
logstash = "9.0"

# Testing
junit = "6.1.3"
groovy = "5.1.0"
spock = "2.4-groovy-5.0"
assertj = "3.27.6"

# Quality
spotless = "8.10.0"
dependency-analysis = "3.18.0"


[plugins]
# Nothing here - the external plugins need to be added as implementation dependencies before they can be
# applied in precompiled script plugin (source: https://docs.gradle.org/current/userguide/custom_plugins.html#applying_external_plugins_in_precompiled_script_plugins)
# Gradle's `alias` can be used only on project level.

[libraries]

annotations = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spock-core.module = "org.spockframework:spock-core"
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dependency-analysis-plugin = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependency-analysis" }