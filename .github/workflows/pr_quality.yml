name: PR Quality

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - ready_for_review

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Build
        run: ./gradlew assemble

      - name: Unit Tests
        run: ./gradlew test

      - name: Coverage Check
        run: ./gradlew coverageCheck

      - name: Publish Coverage Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          from collections import defaultdict
          from pathlib import Path

          marker = "<!-- fair-share-jacoco-report -->"

          def empty_stats():
              return {
                  "line_covered": 0,
                  "line_missed": 0,
                  "branch_covered": 0,
                  "branch_missed": 0,
              }

          def module_name(report):
              parts = report.parts
              build_index = parts.index("build")
              module = parts[:build_index]
              return ":".join(module) if module else "root"

          def add_counter(stats, counter):
              counter_type = counter.attrib["type"]
              covered = int(counter.attrib["covered"])
              missed = int(counter.attrib["missed"])

              if counter_type == "LINE":
                  stats["line_covered"] += covered
                  stats["line_missed"] += missed
              elif counter_type == "BRANCH":
                  stats["branch_covered"] += covered
                  stats["branch_missed"] += missed

          def coverage(covered, missed):
              total = covered + missed
              return 100.0 * covered / total if total else None

          def line_coverage(stats):
              return coverage(
                  stats["line_covered"],
                  stats["line_missed"],
              )

          def branch_coverage(stats):
              return coverage(
                  stats["branch_covered"],
                  stats["branch_missed"],
              )

          def indicator(value):
              if value is None:
                  return "⚪"
              if value >= 85:
                  return "🟢"
              if value >= 65:
                  return "🟠"
              return "🔴"

          def display(value):
              if value is None:
                  return "⚪ —"
              return f"{indicator(value)} {value:.1f}%"

          reports = list(
              Path(".").glob("**/build/reports/jacoco/test/jacocoTestReport.xml")
          )

          if not reports:
              raise RuntimeError("No JaCoCo reports found")

          overall = empty_stats()
          modules = defaultdict(empty_stats)
          packages = defaultdict(empty_stats)

          for report in reports:
              module = module_name(report)
              root = ET.parse(report).getroot()

              for counter in root.findall("counter"):
                  add_counter(overall, counter)
                  add_counter(modules[module], counter)

              for package in root.findall("package"):
                  package_name = package.attrib["name"].replace("/", ".")

                  for counter in package.findall("counter"):
                      add_counter(
                          packages[(module, package_name)],
                          counter,
                      )

          module_rows = "\n".join(
              (
                  f"| `{module}` "
                  f"| {display(line_coverage(stats))} "
                  f"| {display(branch_coverage(stats))} "
                  f"| {stats['line_missed']} |"
              )
              for module, stats in sorted(
                  modules.items(),
                  key=lambda item: (
                      line_coverage(item[1])
                      if line_coverage(item[1]) is not None
                      else 100.0,
                      item[0],
                  ),
              )
          )

          package_rows = "\n".join(
              (
                  f"| `{module}` "
                  f"| `{package}` "
                  f"| {display(line_coverage(stats))} "
                  f"| {display(branch_coverage(stats))} "
                  f"| {stats['line_missed']} |"
              )
              for (module, package), stats in sorted(
                  packages.items(),
                  key=lambda item: (
                      line_coverage(item[1])
                      if line_coverage(item[1]) is not None
                      else 100.0,
                      item[0],
                  ),
              )
          )

          body = f"""{marker}
          ## Coverage

          **Overall line coverage: {display(line_coverage(overall))}**  
          **Overall branch coverage: {display(branch_coverage(overall))}**

          ### Modules

          | Module | Lines | Branches | Missed lines |
          | ------ | ----: | -------: | -----------: |
          {module_rows}

          <details>
          <summary>Packages</summary>

          | Module | Package | Lines | Branches | Missed lines |
          | ------ | ------- | ----: | -------: | -----------: |
          {package_rows}

          </details>
          """

          repository = os.environ["GH_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          comments = request(
              "GET",
              f"{api}/issues/{pr_number}/comments?per_page=100",
          )

          previous = next(
              (
                  comment
                  for comment in comments
                  if comment.get("user", {}).get("type") == "Bot"
                  and marker in comment.get("body", "")
              ),
              None,
          )

          if previous:
              request(
                  "PATCH",
                  f"{api}/issues/comments/{previous['id']}",
                  {"body": body},
              )
          else:
              request(
                  "POST",
                  f"{api}/issues/{pr_number}/comments",
                  {"body": body},
              )
  mutation:
    if: github.event.pull_request.draft == false
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Mutation Testing
        run: ./gradlew mutationCheck

      - name: Publish Mutation Testing Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: python
        run: |
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          from collections import defaultdict
          from pathlib import Path

          marker = "<!-- fair-share-pitest-report -->"

          def empty_stats():
              return {
                  "total": 0,
                  "detected": 0,
                  "survived": 0,
                  "no_coverage": 0,
                  "other": 0,
              }

          def module_name(report):
              parts = report.parts
              build_index = parts.index("build")
              module = parts[:build_index]
              return ":".join(module) if module else "root"

          def package_name(mutation):
              mutated_class = mutation.findtext("mutatedClass") or "(unknown)"
              return (
                  mutated_class.rsplit(".", 1)[0]
                  if "." in mutated_class
                  else "(default)"
              )

          def add(stats, mutation):
              stats["total"] += 1

              detected = mutation.attrib.get("detected") == "true"
              status = mutation.attrib.get("status")

              if detected:
                  stats["detected"] += 1

              if status == "SURVIVED":
                  stats["survived"] += 1
              elif status == "NO_COVERAGE":
                  stats["no_coverage"] += 1
              elif status != "KILLED":
                  stats["other"] += 1

          def score(stats):
              if stats["total"] == 0:
                  return None

              return 100.0 * stats["detected"] / stats["total"]

          def indicator(value):
              if value is None:
                  return "⚪"
              if value >= 85:
                  return "🟢"
              if value >= 65:
                  return "🟠"
              return "🔴"

          def display(value):
              if value is None:
                  return "⚪ —"
              return f"{indicator(value)} {value:.1f}%"

          reports = list(
              Path(".").glob(
                  "**/build/reports/pitest/mutations.xml"
              )
          )

          if not reports:
              raise RuntimeError("No PIT mutation reports found")

          overall = empty_stats()
          modules = defaultdict(empty_stats)
          packages = defaultdict(empty_stats)

          for report in reports:
              module = module_name(report)

              for mutation in ET.parse(report).getroot().findall("mutation"):
                  package = package_name(mutation)

                  add(overall, mutation)
                  add(modules[module], mutation)
                  add(packages[(module, package)], mutation)

          module_rows = "\n".join(
              (
                  f"| `{module}` "
                  f"| {display(score(stats))} "
                  f"| {stats['survived']} "
                  f"| {stats['no_coverage']} "
                  f"| {stats['other']} "
                  f"| {stats['total']} |"
              )
              for module, stats in sorted(
                  modules.items(),
                  key=lambda item: (
                      score(item[1])
                      if score(item[1]) is not None
                      else 100.0,
                      item[0],
                  ),
              )
          )

          package_rows = "\n".join(
              (
                  f"| `{module}` "
                  f"| `{package}` "
                  f"| {display(score(stats))} "
                  f"| {stats['survived']} "
                  f"| {stats['no_coverage']} "
                  f"| {stats['other']} "
                  f"| {stats['total']} |"
              )
              for (module, package), stats in sorted(
                  packages.items(),
                  key=lambda item: (
                      score(item[1])
                      if score(item[1]) is not None
                      else 100.0,
                      item[0],
                  ),
              )
          )

          body = f"""{marker}
          ## Mutation Testing

          **Overall mutation score: {display(score(overall))}**  
          **{overall['detected']} detected / {overall['total']} mutants**

          ### Modules

          | Module | Score | Survived | No coverage | Other | Total |
          | ------ | ----: | -------: | ----------: | ----: | ----: |
          {module_rows}

          <details>
          <summary>Packages</summary>

          | Module | Package | Score | Survived | No coverage | Other | Total |
          | ------ | ------- | ----: | -------: | ----------: | ----: | ----: |
          {package_rows}

          </details>
          """

          repository = os.environ["GH_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          comments = request(
              "GET",
              f"{api}/issues/{pr_number}/comments?per_page=100",
          )

          previous = next(
              (
                  comment
                  for comment in comments
                  if comment.get("user", {}).get("type") == "Bot"
                  and marker in comment.get("body", "")
              ),
              None,
          )

          if previous:
              request(
                  "PATCH",
                  f"{api}/issues/comments/{previous['id']}",
                  {"body": body},
              )
          else:
              request(
                  "POST",
                  f"{api}/issues/{pr_number}/comments",
                  {"body": body},
              )
  quality:
    if: github.event.pull_request.draft == false
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: "25"
          cache: gradle

      - name: Code Quality Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
          pr-mode: true
          post-pr-comment: true
          use-annotations: true
          upload-result: true